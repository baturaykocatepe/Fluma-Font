name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  font-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild all font formats
        run: bash sources/build.sh
      - name: Verify committed sources and binaries are current
        run: git diff --exit-code -- sources/Fluma.ufo fonts
      - name: Audit source and compiled coverage
        run: python tools/audit_font.py
